<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account | GCSE OnTrack</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body><div class="container">
<nav>
<a href="index.html">🏠 Home</a><a href="plan.html">📝 Plan</a><a href="resources.html">📚 Resources</a>
<a href="progress.html">📊 Progress</a><a href="timetable.html">🗓 Timetable</a><a href="guides.html">📖 Guides</a><a href="account.html">👤 Account</a>
</nav>
<header class="pageHeader"><h1>👤 Account</h1><p>Create an account or sign in to GCSE OnTrack.</p></header>
<div class="grid grid2">
<section class="panel"><h2>Create Account</h2><form id="signupForm">
<label>Email</label><input id="signupEmail" type="email" autocomplete="email" required>
<label>Password</label><input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required>
<button class="btn" type="submit">Create Account</button></form></section>
<section class="panel"><h2>Sign In</h2><form id="loginForm">
<label>Email</label><input id="loginEmail" type="email" autocomplete="email" required>
<label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required>
<button class="btn" type="submit">Sign In</button></form>
<button id="resetPassword" class="btn secondary" style="margin-top:12px">Forgot Password?</button></section>
</div>
<div id="accountMessage" class="notice" style="display:none;margin-top:20px"></div>
<section id="loggedInPanel" class="panel" style="display:none;margin-top:20px">
<h2>Account Status</h2><p>Signed in as <strong id="accountEmail"></strong></p>
<button id="logoutBtn" class="btn danger">Log Out</button>
</section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script><script src="js/account.js"></script>
  <script src="js/account-status.js"></script>
</body></html>
