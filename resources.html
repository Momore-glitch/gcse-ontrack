<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

font-family:Arial,sans-serif;

color:white;
max-width:1000px;
margin:auto;
padding:20px;
}

nav{

gap:20px;

margin-bottom:30px;

}

background:#161f36;
padding:20px;

width:100%;

<body>

<nav>

<h1>Study Resources</h1>

<p>
Save every useful GCSE resource in one place.
</p>

<div class="card">

<h2>Add Resource</h2>

<select id="subjectSelect">

<option>Maths</option>
<option>English</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>History</option>
<option>Geography</option>
<option>Business</option>
<option>Computer Science</option>

</select>

<input
id="resourceInput"
type="url"
placeholder="Paste resource link">

<button onclick="addResource()">

Add Resource

</button>

</div>

<div class="card">

<h2>Search</h2>

<input
id="searchInput"
type="text"
placeholder="Search resources..."
onkeyup="filterResources()">

</div>

<div class="card">

<h2>Your Resources</h2>

<ul id="resourceList">

<li>No resources added yet.</li>

</ul>

</div>

<script>

function addResource() {

  const subject =
    document.getElementById("subjectSelect").value;

  const input =
    document.getElementById("resourceInput");

  const list =
    document.getElementById("resourceList");

  if (input.value.trim() === "") return;

  if (list.innerHTML.includes("No resources")) {
    list.innerHTML = "";
  }

  const li = document.createElement("li");

  li.innerHTML = `
    <strong>${subject}</strong><br><br>

    <a href="${input.value}" target="_blank">
      ${input.value}
    </a>

    <br><br>

    <button onclick="toggleFavourite(this)">
      ⭐ Favourite
    </button>

    <button onclick="editResource(this)">
      ✏️ Edit
    </button>

    <button onclick="deleteResource(this)">
      🗑 Delete
    </button>
  `;

  list.appendChild(li);

  input.value = "";

  saveResources();

}

function deleteResource(button){

  button.parentElement.remove();

  const list =
    document.getElementById("resourceList");

  if(list.children.length===0){

    list.innerHTML="<li>No resources added yet.</li>";

  }

  saveResources();

}

function editResource(button){

  const li=button.parentElement;

  const link=li.querySelector("a");

  const updated=
    prompt("Edit link",link.href);

  if(updated===null||updated==="") return;

  link.href=updated;

  link.textContent=updated;

  saveResources();

}

function toggleFavourite(button){

  const li=button.parentElement;

  if(li.dataset.favourite==="true"){

    li.dataset.favourite="false";

    li.style.border="";

  }else{

    li.dataset.favourite="true";

    li.style.border="2px solid gold";

  }

  saveResources();

}

function filterResources(){

  const search=
    document.getElementById("searchInput")
    .value.toLowerCase();

  document
  .querySelectorAll("#resourceList li")
  .forEach(li=>{

    li.style.display=
      li.textContent.toLowerCase()
      .includes(search)
      ?"block":"none";

  });

}
