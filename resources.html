<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCSE Study Resources</title>
</head>

<body style="font-family:sans-serif;max-width:900px;margin:auto;padding:20px;">

<h1>Study Resources</h1>

<p>Organise all your GCSE study links and resources in one place.</p>

<div style="margin-top:24px;padding:18px;border-radius:14px;background:rgba(0,0,0,0.05);">

  <h2>Your Resources</h2>

<input 
  type="text" 
  id="resourceInput" 
  placeholder="Paste a study link..."
  style="width:100%;padding:12px;border-radius:10px;margin-bottom:12px;border:1px solid #ccc;"
>

<button 
  onclick="addResource()" 
  style="padding:10px 16px;border:none;border-radius:10px;background:#4f7cff;color:white;font-weight:600;cursor:pointer;"
>
  Add Resource
</button>

  <ul id="resourceList">
    <li>No resources added yet.</li>
  </ul>

<script>
function addResource() {
  const input = document.getElementById("resourceInput");
  const list = document.getElementById("resourceList");

  if (input.value.trim() === "") return;

  if (list.innerHTML.includes("No resources added yet.")) {
    list.innerHTML = "";
  }

  const li = document.createElement("li");

  li.innerHTML = `<a href="${input.value}" target="_blank">${input.value}</a>`;

  list.appendChild(li);


saveResources();


  input.value = "";
}
</script>

<script>
function saveResources() {
  const links = [];

  document.querySelectorAll("#resourceList li a").forEach(a => {
    links.push(a.href);
  });

  localStorage.setItem("gcseResources", JSON.stringify(links));
}

function loadResources() {
  const saved = JSON.parse(localStorage.getItem("gcseResources")) || [];

  const list = document.getElementById("resourceList");

  if (saved.length > 0) {
    list.innerHTML = "";

    saved.forEach(link => {
      const li = document.createElement("li");

      li.innerHTML = `<a href="${link}" target="_blank">${link}</a>`;

      list.appendChild(li);
    });
  }
}

loadResources();
</script>

</div>

</body>
</html>
