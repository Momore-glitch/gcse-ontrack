<body>

<h1>Study Resources</h1>

<p>
Save every useful GCSE resource in one place.
</p>

<div class="card">

<h2>Add Resource</h2>

<select id="subjectSelect">

<option>Maths</option>
<option>English</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>History</option>
<option>Geography</option>
<option>Business</option>
<option>Computer Science</option>

</select>

<input
id="resourceInput"
type="url"
placeholder="Paste resource link">

<button onclick="addResource()">

Add Resource

</button>

</div>

<div class="card">

<h2>Search</h2>

<input
id="searchInput"
type="text"
placeholder="Search resources..."
onkeyup="filterResources()">

</div>

<div class="card">

<h2>Your Resources</h2>

<button onclick="openSubjectResources()">
📚 Open All For Selected Subject
</button>

<div style="margin-bottom:20px;padding:15px;border-radius:12px;background:#1b2745;">

<h3>Your Library</h3>

    <div id="subjectFilters">

<button onclick="filterBySubject('All')">All</button>
<button onclick="filterBySubject('Maths')">Maths</button>
<button onclick="filterBySubject('English')">English</button>
<button onclick="filterBySubject('Biology')">Biology</button>
<button onclick="filterBySubject('Chemistry')">Chemistry</button>
<button onclick="filterBySubject('Physics')">Physics</button>
<button onclick="filterBySubject('History')">History</button>
<button onclick="filterBySubject('Geography')">Geography</button>
<button onclick="filterBySubject('Business')">Business</button>
<button onclick="filterBySubject('Computer Science')">Computer Science</button>

    </div>

<p>Total Resources:
<span id="resourceCount">0</span>
</p>

</div>

<ul id="resourceList" style="display:flex;flex-direction:column;gap:15px;">

<li>No resources added yet.</li>

</ul>

</div>

<script>

function addResource() {

  const subject =
    document.getElementById("subjectSelect").value;

const tag = prompt(
  "Add a topic/tag (e.g. Algebra, Paper 1, Macbeth):"
) || "General";

const note = prompt(
  "Add an optional note about this resource:"
) || "";

  const input =
    document.getElementById("resourceInput");

  const list =
    document.getElementById("resourceList");

  if (input.value.trim() === "") return;

  if (list.innerHTML.includes("No resources")) {
    list.innerHTML = "";
  }

  const li = document.createElement("li");

li.dataset.created =
resource.created || Date.now();

li.dataset.clicks = 0;

  li.innerHTML = `
    <strong>${subject}</strong>

<span style="
background:#4f7cff;
padding:4px 8px;
border-radius:8px;
font-size:12px;
margin-left:8px;
">

${tag}

</span>

<br><br>

    <a href="${input.value}" target="_blank">
      ${input.value}
    </a>

<br><br>

<p class="resource-note">
${note}
</p>

<br>

    <br><br>

    <button onclick="toggleFavourite(this)">
      ⭐ Favourite
    </button>

    <button onclick="editResource(this)">
      ✏️ Edit
    </button>

    <button onclick="deleteResource(this)">
      🗑 Delete
    </button>
  `;

  list.appendChild(li);

  input.value = "";

  saveResources();

sortResources();

updateResourceCount();

}

function deleteResource(button){

  button.parentElement.remove();

  const list =
    document.getElementById("resourceList");

  if(list.children.length===0){

    list.innerHTML="<li>No resources added yet.</li>";

  }

  saveResources();

updateResourceCount();

}

function editResource(button){

  const li=button.parentElement;

  const link=li.querySelector("a");

  const updated=
    prompt("Edit link",link.href);

  if(updated===null||updated==="") return;

  link.href=updated;

  link.textContent=updated;

  saveResources();

}

function toggleFavourite(button){

  const li=button.parentElement;

  if(li.dataset.favourite==="true"){

    li.dataset.favourite="false";

    li.style.border="";

  }else{

    li.dataset.favourite="true";

    li.style.border="2px solid gold";

  }

  saveResources();



}

function filterResources(){

const searchTerm =
document.getElementById("searchInput")
.value
.toLowerCase();

document.querySelectorAll("#resourceList li")
.forEach(li=>{

if(li.querySelector("a")==null) return;

const text =
li.textContent.toLowerCase();

li.style.display =
text.includes(searchTerm)
? ""
: "none";

});

}

function saveResources() {

  const resources = [];

  document.querySelectorAll("#resourceList li").forEach(li => {

    if (li.querySelector("a") === null) return;

   resources.push({

  subject: li.querySelector("strong").textContent,

  tag: li.querySelector("span").textContent,

  link: li.querySelector("a").href,

note: li.querySelector(".resource-note").textContent,

  favourite: li.dataset.favourite==="true",

  created: li.dataset.created,

clicks: li.dataset.clicks


});

  localStorage.setItem(
    "gcseResources",
    JSON.stringify(resources)
  );

}

function openSubjectResources(){

  const subject =
    document.getElementById("subjectSelect").value;

  document.querySelectorAll("#resourceList li").forEach(li=>{

    const savedSubject =
      li.querySelector("strong").textContent;

    if(savedSubject===subject){

      window.open(
        li.querySelector("a").href,
        "_blank"
      );

    }

  });

}

function sortResources(){

  const list = document.getElementById("resourceList");

  const items = [...list.querySelectorAll("li")];

  items.sort((a,b)=>
    Number(b.dataset.created||0)-
    Number(a.dataset.created||0)
  );

  items.forEach(item=>list.appendChild(item));

}

function trackClick(link){

    const li = link.closest("li");

    let clicks = Number(li.dataset.clicks);

    clicks++;

    li.dataset.clicks = clicks;

    li.querySelector(".clickCount").textContent =
        `Opened ${clicks} ${clicks===1?"time":"times"}`;

    saveResources();

}

renderResources();

function loadResources() {

  const saved =
    JSON.parse(localStorage.getItem("gcseResources")) || [];

  if(saved.length===0) return;

  const list =
    document.getElementById("resourceList");

  list.innerHTML="";

  saved.forEach(resource=>{

    const li=document.createElement("li");

    if(resource.favourite){

      li.dataset.favourite="true";

      li.style.border="2px solid gold";

    }

li.innerHTML = `

    <strong>${resource.subject}</strong>

<span style="
background:#4f7cff;
padding:4px 8px;
border-radius:8px;
font-size:12px;
margin-left:8px;
">

${resource.tag}

</span>

      <a
href="${formattedLink}"
target="_blank"
onclick="trackClick(this)"
>
${formattedLink}
</a>

<br><br>

<small class="clickCount">
Opened ${resource.clicks || 0}
${(resource.clicks || 0)==1?"time":"times"}
</small>

<br><br>

<p class="resource-note">
${resource.note || ""}
</p>

<br>

      <br><br>

      <button onclick="toggleFavourite(this)">
        ⭐ Favourite
      </button>

      <button onclick="editResource(this)">
        ✏️ Edit
      </button>

      <button onclick="deleteResource(this)">
        🗑 Delete
      </button>

    `;

    list.appendChild(li);

  });

}

function updateResourceCount(){

  document.getElementById("resourceCount").textContent =
    document.querySelectorAll("#resourceList li a").length;

}

loadResources();

updateResourceCount();

</script>

</body>
</html>
