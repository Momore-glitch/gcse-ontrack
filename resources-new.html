<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GCSE Study Resources | GCSE OnTrack</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;
background:#0b1020;
color:white;
max-width:1100px;
margin:auto;
padding:20px;

}

nav{

display:flex;
gap:20px;
flex-wrap:wrap;
padding:20px 0;
border-bottom:1px solid #2c3554;
margin-bottom:30px;

}

nav a{

color:white;
text-decoration:none;
font-weight:bold;

}

nav a:hover{

color:#4f7cff;

}

h1{

margin-bottom:10px;

}

p{

line-height:1.6;

}

.card{

background:#161f36;
padding:20px;
border-radius:16px;
margin-bottom:25px;

}

.card h2{

margin-bottom:15px;

}

input,
select,
textarea{

width:100%;
padding:12px;
margin-top:12px;
margin-bottom:12px;

border:none;
border-radius:10px;

font-size:16px;

background:#eef2ff;

}

textarea{

resize:vertical;
min-height:90px;

}

button{

padding:12px 18px;

border:none;

border-radius:10px;

background:#4f7cff;

color:white;

font-weight:bold;

cursor:pointer;

margin-right:8px;
margin-top:8px;

transition:.2s;

}

button:hover{

background:#3b68df;

}

.library{

background:#1b2745;
padding:18px;
border-radius:12px;
margin-top:20px;
margin-bottom:20px;

}

.library p{

margin-top:10px;

}

#resourceList{

list-style:none;

display:flex;

flex-direction:column;

gap:15px;

}

.resource{

background:#212c47;

padding:18px;

border-radius:12px;

border:2px solid transparent;

}

.resource a{

color:#82b0ff;
word-break:break-word;

}

.tag{

display:inline-block;

background:#4f7cff;

padding:5px 10px;

border-radius:20px;

font-size:12px;

margin-left:8px;

}

.resource-note{

margin-top:12px;

font-style:italic;

color:#c7d2ea;

}

.clickCount{

display:block;

margin-top:12px;

font-size:13px;

color:#9fb3d1;

}

.favourite{

border-color:gold;

}

.empty{

text-align:center;

padding:30px;

opacity:.7;

}

</style>

</head>

<body>

<nav>

<a href="index.html">Home</a>

<a href="plan.html">Revision Plan</a>

<a href="resources.html">Resources</a>

<a href="progress.html">Progress</a>

<a href="timetable.html">Timetable</a>

<a href="guides.html">Guides</a>

</nav>

<h1>Study Resources</h1>

<p>

Save every useful GCSE resource in one organised library.

</p>

<div class="card">

<h2>Add Resource</h2>

<select id="subjectSelect">

<option>Maths</option>
<option>English</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Physics</option>
<option>History</option>
<option>Geography</option>
<option>Business</option>
<option>Computer Science</option>

</select>

<input
id="resourceInput"
type="url"
placeholder="https://example.com">

<input
id="tagInput"
type="text"
placeholder="Topic (e.g. Algebra, Macbeth, Paper 1)">

<textarea
id="noteInput"
placeholder="Optional notes..."></textarea>

<button onclick="addResource()">

➕ Add Resource

</button>

</div>

<div class="card">

<h2>Search Resources</h2>

<input
id="searchInput"
type="text"
placeholder="Search by subject, tag, note or link..."
onkeyup="filterResources()">

</div>

<div class="card">

<h2>Your Library</h2>

<button onclick="openSubjectResources()">

📚 Open All For Selected Subject

</button>

<div class="library">

<h3>Saved Resources</h3>

<p>

Total Resources:
<strong id="resourceCount">0</strong>

</p>

</div>

<ul id="resourceList">

<li class="empty">

No resources added yet.

</li>

</ul>

</div>

<script>

const STORAGE_KEY = "gcseResources";

let resources = [];

function saveResources(){

localStorage.setItem(

STORAGE_KEY,

JSON.stringify(resources)

);

}

function loadResources(){

resources = JSON.parse(

localStorage.getItem(STORAGE_KEY)

) || [];

renderResources();

}

function renderResources(){

const list = document.getElementById("resourceList");

list.innerHTML = "";

if(resources.length===0){

list.innerHTML = `

<li class="empty">

No resources added yet.

</li>

`;

updateResourceCount();

return;

}

resources.sort(

(a,b)=>b.created-a.created

);

resources.forEach((resource,index)=>{

const li=document.createElement("li");

li.className="resource";

if(resource.favourite){

li.classList.add("favourite");

}

li.innerHTML=`

<strong>${resource.subject}</strong>

<span class="tag">

${resource.tag}

</span>

<br><br>

<a
href="${resource.link}"
target="_blank"
onclick="trackClick(${index})">

${resource.link}

</a>

<p class="resource-note">

${resource.note || ""}

</p>

<small class="clickCount">

Opened ${resource.clicks} ${resource.clicks===1?"time":"times"}

</small>

<br>

<button onclick="toggleFavourite(${index})">

⭐ Favourite

</button>

<button onclick="editResource(${index})">

✏ Edit

</button>

<button onclick="deleteResource(${index})">

🗑 Delete

</button>

`;

list.appendChild(li);

});

updateResourceCount();

}

function addResource(){

const subject=document.getElementById("subjectSelect").value;
const link=document.getElementById("resourceInput").value.trim();
const tag=document.getElementById("tagInput").value.trim() || "General";
const note=document.getElementById("noteInput").value.trim();

if(link===""){
alert("Please enter a resource link.");
return;
}

try{
new URL(link);
}catch{
alert("Please enter a valid URL.");
return;
}

const duplicate=resources.some(
r=>r.link.toLowerCase()===link.toLowerCase()
);

if(duplicate){
alert("This resource has already been added.");
return;
}

resources.push({

subject,
link,
tag,
note,
favourite:false,
clicks:0,
created:Date.now()

});

saveResources();

renderResources();

document.getElementById("resourceInput").value="";
document.getElementById("tagInput").value="";
document.getElementById("noteInput").value="";

}

function deleteResource(index){

if(!confirm("Delete this resource?")) return;

resources.splice(index,1);

saveResources();

renderResources();

}

function editResource(index){

const resource=resources[index];

const newLink=prompt("Edit resource link",resource.link);

if(newLink===null) return;

try{

new URL(newLink);

}catch{

alert("Invalid URL.");

return;

}

resource.link=newLink;

const newTag=prompt("Edit tag",resource.tag);

if(newTag!==null){

resource.tag=newTag;

}

const newNote=prompt("Edit note",resource.note);

if(newNote!==null){

resource.note=newNote;

}

saveResources();

renderResources();

}

function toggleFavourite(index){

resources[index].favourite=!resources[index].favourite;

saveResources();

renderResources();

}

function trackClick(index){

resources[index].clicks++;

saveResources();

renderResources();

}



function updateResourceCount(){

document.getElementById("resourceCount").textContent=
resources.length;

}

function filterResources(){

const search=document.getElementById("searchInput")
.value
.toLowerCase();

document.querySelectorAll("#resourceList .resource")
.forEach(card=>{

const text=card.textContent.toLowerCase();

card.style.display=
text.includes(search)
? ""
: "none";

});

}

function openSubjectResources(){

const subject=document.getElementById("subjectSelect").value;

resources
.filter(r=>r.subject===subject)
.forEach(r=>window.open(r.link,"_blank"));

}

loadResources();

</script>

</body>

</html>
