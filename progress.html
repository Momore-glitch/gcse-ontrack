<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Tracker</title>
</head>

<body style="font-family:sans-serif;max-width:900px;margin:auto;padding:20px;">

<nav style="
display:flex;
gap:20px;
padding:16px 0;
margin-bottom:20px;
border-bottom:1px solid #ddd;
">
  <a href="index.html">Home</a>
  <a href="plan.html">Revision Plan</a>
  <a href="resources.html">Resources</a>
  <a href="progress.html">Progress</a>
</nav>

<h1>Progress Tracker</h1>

<div style="margin:20px 0;padding:20px;border-radius:12px;background:rgba(79,124,255,0.12);">
  <h2>Today's Goal</h2>

  <p id="dailyGoal">
    Complete one focused 30-minute revision session.
  </p>

  <button onclick="completeGoal()">
    Mark as Complete
  </button>

  <p id="goalStatus"></p>

<p>
🔥 Study Streak:
<strong id="streak">0</strong> day(s)
</p>
</div>

<div style="margin-top:30px;padding:20px;border-radius:12px;background:rgba(0,0,0,0.05);">

<div style="margin-top:30px;padding:20px;border-radius:12px;background:rgba(0,0,0,0.05);">
  <h2>My Target Grade</h2>

  <select id="targetGrade">
    <option>9</option>
    <option>8</option>
    <option>7</option>
    <option>6</option>
    <option>5</option>
    <option>4</option>
  </select>

  <button onclick="saveTargetGrade()">
    Save
  </button>

  <p id="targetMessage"></p>
</div>

<div style="margin-top:30px;padding:20px;border-radius:12px;background:rgba(0,0,0,0.05);">

<h2>Revision Session Timer</h2>

<p id="timer">25:00</p>

<button onclick="startTimer()">Start</button>
<button onclick="resetTimer()">Reset</button>

</div>

  <h2>Past Paper Tracker</h2>

  <p>Past papers completed:</p>

  <p id="paperCount">0</p>

  <button onclick="addPaper()">
    + Completed a Past Paper
  </button>
</div>

<p>Track your GCSE revision progress.</p>

<div style="
padding:20px;
border-radius:12px;
background:rgba(0,0,0,0.05);
">
  <p>No progress data yet.</p>
</div>


<script>
let paperCount = Number(localStorage.getItem("paperCount")) || 0;

document.getElementById("paperCount").textContent = paperCount;

function addPaper() {
  paperCount++;
  localStorage.setItem("paperCount", paperCount);
  document.getElementById("paperCount").textContent = paperCount;
}

let streak = Number(localStorage.getItem("studyStreak")) || 0;

function completeGoal() {
  document.getElementById("goalStatus").textContent =
    "✅ Goal completed today!";

  streak++;

  localStorage.setItem("studyStreak", streak);

  document.getElementById("streak").textContent = streak;
}

function saveTargetGrade() {
  const grade = document.getElementById("targetGrade").value;

  localStorage.setItem("targetGrade", grade);

  document.getElementById("targetMessage").textContent =
    "Target Grade: " + grade;
}

const savedGrade = localStorage.getItem("targetGrade");

if (savedGrade) {
  document.getElementById("targetGrade").value = savedGrade;
  document.getElementById("targetMessage").textContent =
    "Target Grade: " + savedGrade;
}

document.getElementById("streak").textContent = streak;

let timeLeft = 1500;
let timer;

function updateTimer() {
  const minutes = Math.floor(timeLeft / 60);
  const seconds = timeLeft % 60;

  document.getElementById("timer").textContent =
    `${minutes}:${seconds.toString().padStart(2,"0")}`;
}

function startTimer() {

  if (timer) return;

  timer = setInterval(() => {

    if (timeLeft <= 0) {
      clearInterval(timer);
      timer = null;
      alert("Revision session complete!");
      return;
    }

    timeLeft--;

    updateTimer();

  },1000);

}

function resetTimer() {

  clearInterval(timer);

  timer = null;

  timeLeft = 1500;

  updateTimer();

}

updateTimer();
</script>

</body>
</html>
