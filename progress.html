<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress | GCSE OnTrack</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="container"><nav>
<a href="index.html">🏠 Home</a><a href="account.html">👤 Account</a><a href="plan.html">📝 Plan</a><a href="resources.html">📚 Resources</a><a href="progress.html">📊 Progress</a><a href="timetable.html">🗓 Timetable</a><a href="guides.html">📖 Guides</a>
</nav><header id="progressPage" class="pageHeader"><h1>Progress Tracker</h1><p>Track papers, daily sessions, targets and subject progress.</p></header><div class="grid grid4"><div class="panel stat"><h3>Past Papers</h3><strong id="paperCount">0</strong></div><div class="panel stat"><h3>Study Streak</h3><strong id="streak">0</strong></div><div class="panel stat"><h3>Target</h3><strong id="targetMessage">—</strong></div><div class="panel stat"><h3>Timer</h3><strong id="timer">25:00</strong></div></div><div class="grid grid2" style="margin-top:20px"><section class="panel"><h2>Quick Actions</h2><div class="actions"><button id="addPaper" class="btn">➕ Paper Completed</button><button id="completeGoal" class="btn success">✅ Complete Today's Goal</button></div><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><label>Target grade</label><select id="targetGrade"><option value="">Choose</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select><button id="saveTarget" class="btn">Save Target</button><h3 style="margin-top:25px">Custom Focus Timer</h3>
<div class="grid grid2">
<div><label for="timerMinutes">Minutes</label><input id="timerMinutes" type="number" min="0" max="999" value="25"></div>
<div><label for="timerSeconds">Seconds</label><input id="timerSeconds" type="number" min="0" max="59" value="0"></div>
</div>
<div class="actions" style="margin-top:10px;flex-wrap:wrap">
<button id="setTimer" class="btn secondary">Set Timer</button>
<button id="startTimer" class="btn">▶ Start</button>
<button id="pauseTimer" class="btn warning">⏸ Pause</button>
<button id="resetTimer" class="btn secondary">↻ Reset</button>
</div>
<div class="actions" style="margin-top:10px;flex-wrap:wrap">
<button class="btn secondary small" data-timer-preset="5">5 min</button>
<button class="btn secondary small" data-timer-preset="10">10 min</button>
<button class="btn secondary small" data-timer-preset="25">25 min</button>
<button class="btn secondary small" data-timer-preset="45">45 min</button>
<button class="btn secondary small" data-timer-preset="60">60 min</button>
</div></section><section class="panel"><h2>Subject Progress</h2><input id="progressSubject" placeholder="e.g. Maths"><button id="addSubject" class="btn">Add Subject</button><p id="progressSummary" class="muted" style="margin-top:15px"></p><div id="subjectProgress" class="grid" style="margin-top:15px"></div></section></div><div class="panel" style="margin-top:20px"><h2>Recent Activity</h2><ul id="historyList"></ul></div></div><script src="js/storage.js"></script><script src="js/progress.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/account-status.js"></script></body></html>
