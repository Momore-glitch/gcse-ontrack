<header class="pageHeader">
<h1>Revision Plan Generator</h1>
<p>Build a revision plan around your exam date, subjects and weekly study time.</p>
</header>
<div class="grid grid2">
<form id="planForm" class="panel">
<h2>Your Inputs</h2>
<label for="examDate">Exam date</label>
<input id="examDate" type="date" required>
<label for="subjects">Subjects</label>
<input id="subjects" type="text" placeholder="Maths, English, Biology" required>
<label for="hours">Hours per week</label>
<input id="hours" type="number" min="1" max="80" value="10" required>
<div class="actions">
<button class="btn" type="submit">⚡ Generate Plan</button>
<button class="btn secondary" type="button" id="clearPlan">Clear</button>
</div>
</form>
<section id="planOutput"></section>
</div>
</div>
<script src="js/storage.js"></script>
<script src="js/planner.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

</body>
